# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qti-coqos"
BBFILE_PATTERN_qti-coqos = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-coqos = "40"

LAYERSERIES_COMPAT_qti-coqos = "dunfell gatesgarth hardknott kirkstone"

LAYERDEPENDS_qti-coqos = "qti"

PREFERRED_VERSION_meson = "0.53.2"
PREFERRED_VERSION_meson-native = "0.53.2"
